spring.application.name=guidance-teacher-system
server.port=8080

# ---- Local development database: H2 in memory (data is wiped at every restart) ----
spring.datasource.url=jdbc:h2:mem:guidance;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate builds the tables from the @Entity classes; then data.sql inserts the demo rows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false

# Keeps lazy relations usable inside Thymeleaf pages (needed by our LAZY @ManyToOne fields)
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
