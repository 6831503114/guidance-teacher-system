# Activated on Cloud Run with SPRING_PROFILES_ACTIVE=prod.  NO secrets in this file: they come from environment variables.
spring.datasource.url=jdbc:mysql:///${DB_NAME:guidance}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
# data.sql is for the dev H2 only. Seed the real database ONCE by hand (Cloud SQL Studio) - and never with the demo passwords.
spring.sql.init.mode=never
server.port=${PORT:8080}
